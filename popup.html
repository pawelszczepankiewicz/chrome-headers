<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Headers - SEO - Sitemaps - Pixels</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Headers - SEO - Sitemaps - Pixels</h1>

      <div class="tabs">
        <button class="tab-button active" data-tab="headers">Headers</button>
        <button class="tab-button" data-tab="seo">SEO</button>
        <button class="tab-button" data-tab="sitemap">Sitemaps</button>
        <button class="tab-button" data-tab="pixels">Pixels</button>
      </div>

      <!-- Headers Tab -->
      <div class="tab-content active" id="headers-tab">
        <div class="status">
          <label>
            <input type="checkbox" id="enabled" />
            Enable Custom Headers
          </label>
        </div>

        <div class="headers-list" id="headersList"></div>

        <div class="add-header" id="headerForm">
          <h3 id="formTitle">Add New Header</h3>
          <input type="text" id="headerName" placeholder="Header Name" />
          <input type="text" id="headerValue" placeholder="Header Value" />
          <input
            type="text"
            id="headerDomain"
            placeholder="Domain (optional, e.g. example.com)"
          />
          <div class="form-buttons">
            <button id="addButton">Add Header</button>
            <button
              id="cancelEditButton"
              class="secondary"
              style="display: none"
            >
              Cancel
            </button>
          </div>
          <input type="hidden" id="editIndex" value="-1" />
        </div>

      </div>

      <!-- SEO Tab -->
      <div class="tab-content" id="seo-tab">
        <div class="seo-actions">
          <button id="analyzeSeoButton" class="primary">
            Analyze Current Page
          </button>
        </div>

        <div id="seoResults" class="seo-results">
          <p class="empty">Click "Analyze Current Page" to extract SEO data</p>
        </div>
      </div>

      <!-- Sitemap Tab -->
      <div class="tab-content" id="sitemap-tab">
        <div class="seo-actions">
          <button id="checkSitemapButton" class="primary">Check Sitemap</button>
        </div>

        <div id="sitemapResults" class="seo-results">
          <p class="empty">
            Click "Check Sitemap" to analyze sitemap.xml and robots.txt
          </p>
        </div>
      </div>

      <!-- Pixels Tab -->
      <div class="tab-content" id="pixels-tab">
        <div class="seo-actions">
          <button id="detectPixelsButton" class="primary">
            Detect Tracking Pixels
          </button>
        </div>

        <div id="pixelsResults" class="seo-results">
          <p class="empty">
            Click "Detect Tracking Pixels" to find analytics and marketing tags
          </p>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
