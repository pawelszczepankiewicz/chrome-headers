<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate Extension Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0052a3;
    }
    .preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Extension Icon Generator</h1>
  <p>Click the buttons below to download the required icon files:</p>

  <div class="preview">
    <div>
      <p>16x16</p>
      <canvas id="icon16" width="16" height="16"></canvas>
    </div>
    <div>
      <p>48x48</p>
      <canvas id="icon48" width="48" height="48"></canvas>
    </div>
    <div>
      <p>128x128</p>
      <canvas id="icon128" width="128" height="128"></canvas>
    </div>
  </div>

  <div>
    <button onclick="downloadIcon(16)">Download icon16.png</button>
    <button onclick="downloadIcon(48)">Download icon48.png</button>
    <button onclick="downloadIcon(128)">Download icon128.png</button>
    <button onclick="downloadAll()">Download All</button>
  </div>

  <script>
    // Draw icon on canvas
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');

      // Background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#0066cc');
      gradient.addColorStop(1, '#0052a3');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // Draw "H" for Headers
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('H', size / 2, size / 2);
    }

    // Initialize all canvases
    drawIcon(document.getElementById('icon16'), 16);
    drawIcon(document.getElementById('icon48'), 48);
    drawIcon(document.getElementById('icon128'), 128);

    // Download icon
    function downloadIcon(size) {
      const canvas = document.getElementById(`icon${size}`);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Download all icons
    function downloadAll() {
      downloadIcon(16);
      setTimeout(() => downloadIcon(48), 200);
      setTimeout(() => downloadIcon(128), 400);
    }
  </script>
</body>
</html>
